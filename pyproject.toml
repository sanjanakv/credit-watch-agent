[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-signal-scout"
version = "0.1.0"
description = "Exposure-driven early-warning scanner for corporate credit monitoring (DEMO - synthetic clients only)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scout = "scout.cli:main"

[tool.setuptools.packages.find]
include = ["scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Grok API (needs XAI_API_KEY); skipped by default"]
